name: Feature request
description: Ajukan fitur atau perbaikan
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Masalah yang ingin diselesaikan
      placeholder: "Ketika saya ..., saya perlu ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solusi yang diusulkan
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Dampak keamanan / kompatibilitas
      description: Adakah tool baru, akses jaringan, secret, migrasi DB, atau perubahan approval?
    validations:
      required: false
